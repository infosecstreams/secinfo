# This workflow will sort in{dex,active}.md and commit the changes back to the repository.
name: Build secinfo Binary

# Controls when the workflow will run
on:
  # Releases come only from tags: GoReleaser fails on an untagged commit, and
  # building on both the main push and the tag push raced two identical
  # image pushes.
  push:
    tags: ["v*"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # GoReleaser creates the GitHub release
      packages: write      # push to ghcr.io
      id-token: write      # keyless cosign signature + attestation (GitHub OIDC)
      attestations: write  # build provenance attestation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        name: Checkout repository
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version: 1.26

      - name: Login to registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sign what GoReleaser pushed, so the site workflow can check that its
      # pinned digest came from this workflow on a release tag.
      - name: Resolve pushed digest
        id: digest
        if: github.ref_type == 'tag'
        env:
          REF: ghcr.io/infosecstreams/secinfo:${{ github.ref_name }}
        run: |
          set -euo pipefail
          d=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest '$d' for $REF"; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "Pushed ghcr.io/infosecstreams/secinfo@$d (pin this in the site workflow)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign image (keyless, GitHub OIDC)
        if: github.ref_type == 'tag'
        env:
          REF: ghcr.io/infosecstreams/secinfo@${{ steps.digest.outputs.digest }}
          WORKFLOW: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "$REF"
          cosign verify "$REF" \
            --certificate-identity "$WORKFLOW" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/infosecstreams/secinfo
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
